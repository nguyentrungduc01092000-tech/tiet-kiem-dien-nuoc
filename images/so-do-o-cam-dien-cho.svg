<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Sơ đồ ổ cắm điện chờ trong nhà: ổ cắm kéo dài có công tắc, cắm tivi, sạc điện thoại và máy in, cả ba đều có đèn đỏ báo điện chờ. Tắt công tắc ổ cắm khi không dùng để ngắt điện chờ.">
  <title>Ổ cắm điện chờ trong nhà</title>
  <rect x="0" y="0" width="800" height="520" fill="#f4f8fb"/>
  <text x="400" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a3a4d">Ổ cắm điện chờ trong nhà</text>
  <text x="400" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a6572">Hình minh họa được vẽ riêng cho website, không phải ảnh chụp thực hành</text>
  <!-- Power strip -->
  <rect x="110" y="130" width="580" height="110" rx="12" fill="#dbe7ee" stroke="#1a3a4d" stroke-width="3"/>
  <circle cx="190" cy="185" r="26" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <circle cx="190" cy="185" r="10" fill="#1a3a4d"/>
  <circle cx="330" cy="185" r="26" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <circle cx="330" cy="185" r="10" fill="#1a3a4d"/>
  <circle cx="470" cy="185" r="26" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <circle cx="470" cy="185" r="10" fill="#1a3a4d"/>
  <rect x="590" y="160" width="70" height="50" rx="8" fill="#c0392b" stroke="#1a3a4d" stroke-width="2"/>
  <text x="625" y="192" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">TẮT</text>
  <text x="625" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a3a4d">Công tắc</text>
  <!-- Cables up -->
  <line x1="190" y1="130" x2="190" y2="110" stroke="#1a3a4d" stroke-width="3"/>
  <line x1="330" y1="130" x2="330" y2="110" stroke="#1a3a4d" stroke-width="3"/>
  <line x1="470" y1="130" x2="470" y2="110" stroke="#1a3a4d" stroke-width="3"/>
  <!-- Devices -->
  <rect x="120" y="280" width="140" height="90" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="190" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a3a4d">Tivi</text>
  <circle cx="245" cy="345" r="8" fill="#c0392b"/>
  <text x="180" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">Đèn chờ</text>
  <rect x="300" y="280" width="140" height="90" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="370" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a3a4d">Sạc điện thoại</text>
  <circle cx="425" cy="345" r="8" fill="#c0392b"/>
  <text x="360" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">Đèn chờ</text>
  <rect x="480" y="280" width="140" height="90" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="550" y="315" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a3a4d">Máy in</text>
  <circle cx="605" cy="345" r="8" fill="#c0392b"/>
  <text x="540" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">Đèn chờ</text>
  <!-- Note -->
  <rect x="110" y="400" width="580" height="80" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
  <text x="400" y="432" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a5c00">Tắt công tắc ổ cắm khi không dùng để ngắt điện chờ</text>
  <text x="400" y="460" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#7a5c00">Điện chờ chiếm 5–10% điện nhà ở Mỹ theo Bộ Năng lượng Mỹ (DOE)</text>
  <text x="400" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6572">Đèn đỏ còn sáng nghĩa là thiết bị vẫn đang dùng điện chờ.</text>
</svg>
