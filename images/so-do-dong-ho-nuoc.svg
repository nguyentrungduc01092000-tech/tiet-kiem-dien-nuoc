<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="Sơ đồ đọc đồng hồ nước để kiểm tra rò rỉ: ghi số đồng hồ lần 1, không dùng nước trong 2 giờ, ghi số lần 2. Nếu số thay đổi thì có thể có rò rỉ. Nếu số không đổi thì không có rò rỉ.">
  <title>Đọc đồng hồ nước để kiểm tra rò rỉ</title>
  <rect x="0" y="0" width="800" height="520" fill="#f4f8fb"/>
  <text x="400" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a3a4d">Đọc đồng hồ nước để kiểm tra rò rỉ</text>
  <text x="400" y="74" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4a6572">Hình minh họa tự vẽ, không phải ảnh chụp thực hành</text>
  <!-- Water meter -->
  <rect x="230" y="110" width="340" height="180" rx="14" fill="#dbe7ee" stroke="#1a3a4d" stroke-width="3"/>
  <circle cx="400" cy="200" r="70" fill="#ffffff" stroke="#1a3a4d" stroke-width="3"/>
  <rect x="350" y="185" width="100" height="34" fill="#1a3a4d"/>
  <text x="400" y="211" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">01234</text>
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6572">m³</text>
  <text x="400" y="275" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1a3a4d">Đồng hồ nước</text>
  <!-- Pipe -->
  <line x1="60" y1="200" x2="230" y2="200" stroke="#5b7a8c" stroke-width="10"/>
  <line x1="570" y1="200" x2="740" y2="200" stroke="#5b7a8c" stroke-width="10"/>
  <text x="145" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6572">Nước vào nhà</text>
  <text x="655" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4a6572">Nước vào nhà</text>
  <!-- Steps -->
  <rect x="80" y="320" width="200" height="110" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="180" y="352" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a4d">1. Ghi số lần 1</text>
  <text x="180" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">Ghi lại số trên</text>
  <text x="180" y="402" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">đồng hồ nước</text>
  <text x="300" y="382" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1a3a4d">→</text>
  <rect x="320" y="320" width="200" height="110" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="420" y="352" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a4d">2. Chờ 2 giờ</text>
  <text x="420" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">Không dùng nước</text>
  <text x="420" y="402" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">trong 2 giờ</text>
  <text x="540" y="382" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1a3a4d">→</text>
  <rect x="560" y="320" width="200" height="110" rx="8" fill="#ffffff" stroke="#1a3a4d" stroke-width="2"/>
  <text x="660" y="352" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a4d">3. Ghi số lần 2</text>
  <text x="660" y="380" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">Ghi lại số trên</text>
  <text x="660" y="402" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a6572">đồng hồ nước</text>
  <!-- Result -->
  <rect x="80" y="450" width="330" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="245" y="481" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Số thay đổi → có thể có rò rỉ</text>
  <rect x="430" y="450" width="330" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="595" y="481" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e7d32">Số không đổi → không rò rỉ</text>
</svg>
